services:
  api:
    build: .
    image: rag-ingest:latest
    ports: ["8000:8000"]
    env_file: .env
    environment: &env
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on: [redis, qdrant]
    restart: unless-stopped

  worker:
    image: rag-ingest:latest          # same image as api, so it's built once
    command: celery -A app.worker.celery_app.celery worker --loglevel=info --concurrency=2
    env_file: .env
    environment: *env
    volumes: [uploads:/data/uploads]
    depends_on: [api, redis, qdrant]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes: [redisdata:/data]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrantdata:/qdrant/storage]
    restart: unless-stopped

volumes:
  uploads:
  redisdata:
  qdrantdata: